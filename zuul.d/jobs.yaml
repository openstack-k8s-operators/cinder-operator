---
- job:
    name: cinder-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    attempts: 1
    required-projects:
      - github.com/openstack-k8s-operators/cinder-operator
    irrelevant-files: &common-irrelevant-files
      - .*/*.md
      - ^\..*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - tests?\/functional
      - ^renovate.json$
    vars:
      cifmw_kuttl_tests_operator_list:
        - cinder

- job:
    name: cinder-operator-tempest
    parent: podified-multinode-hci-deployment-crc-1comp-backends
    irrelevant-files: *common-irrelevant-files
    vars:
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^tempest.api.volume.
        ^tempest.scenario.test_encrypted_cinder_volumes..*
        ^tempest.scenario.test_stamp_pattern..*
        ^tempest.scenario.test_volume_..*
        ^cinder_tempest_plugin..*
      # plain/cryptsetup volume encryption tests are not supported
      # with the ceph backend
      cifmw_test_operator_tempest_exclude_list: |
        test_encrypted_cinder_volumes_cryptsetup
      # volume-feature-enabled.extend_attached_encrypted_volume is temporarily
      # disabled until OSPRH-14321 is solved.
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          compute-feature-enabled.attach_encrypted_volume True
          volume-feature-enabled.extend_attached_encrypted_volume False
          volume-feature-enabled.extend_attached_volume True
          volume-feature-enabled.volume_revert True
          volume.storage_protocol 'ceph'

- job:
    name: cinder-s2i-content-provider
    parent: s2i-openstack-container-content-provider
    description: |
      Build s2i cinder service images for cinder-s2i-tempest.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
        override-checkout: main
    vars:
      s2i_ci_images:
        - cinder/cinder-api
        - cinder/cinder-backup
        - cinder/cinder-scheduler
        - cinder/cinder-volume

- job:
    name: cinder-s2i-tempest
    parent: cinder-operator-tempest
    description: |
      Validate speculatively-built s2i cinder images against a live
      HCI OpenStack deployment with Ceph. s2i-built images from the
      content provider are applied to OpenStackVersion during
      edpm_prepare via ci-framework set_containers before the control
      plane is deployed.

      Scalar OpenStackVersion fields (API, backup, scheduler) come from
      the s2i image map. cinder-volume is a backend map
      (cinderVolumeImages) and is injected for the HCI CinderVolume
      named volume1; the operator always resets the default key.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
        override-checkout: main
    vars:
      # Operator CP owns content_provider_registry_ip (catalog + CRC
      # insecure list). Append the s2i registry so CRC can pull both.
      cifmw_crc_additional_insecure_registries:
        - "{{ s2i_content_provider_registry_ip }}:5001"
      cifmw_crc_additional_allowed_registries:
        - "{{ s2i_content_provider_registry_ip }}:5001"
      cifmw_set_containers_preserve_unlisted: true
      # Zuul rejects vars that start with "_". Keep the mapping in one
      # expression: scalar OpenStackVersion fields from the s2i provider,
      # plus cinderVolumeImages.volume1 for the HCI CinderVolume.
      cifmw_set_containers_images: >-
        {{
          (
            s2i_content_provider_os_custom_container_images | dict2items |
            json_query('[].{name: key, full_registry: value}')
          ) + [{
            'name': 'cinderVolumeImages',
            'full_registry': (
              s2i_content_provider_registry_ip ~ ':5001/' ~
              s2i_ci_content.namespace ~
              '/openstack-cinder-volume:' ~
              s2i_ci_content.tag
            ),
            'backends': ['volume1']
          }]
        }}
