---
# project template to be used locally for operator testing
- project-template:
    name: cinder-operator-s2i-testing
    github-check:
      jobs:
        - cinder-s2i-content-provider
        - cinder-s2i-test-ceph:
            dependencies: &cinder_s2i_test_dependencies
              - openstack-k8s-operators-content-provider
              - cinder-s2i-content-provider

# project template to be used in the s2i repository
- project-template:
    name: cinder-operator-s2i-component-jobs
    github-check:
      jobs:
        - cinder-s2i-test-ceph: &cinder_s2i_component_overrides
            vars:
              content_provider_registry_ip: "{{ s2i_content_provider_registry_ip }}"
            files:
              - ^containers/base/
              - ^containers/cinder/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke
        - cinder-s2i-test-ceph: *cinder_s2i_component_overrides

- project:
    name: openstack-k8s-operators/cinder-operator
    templates:
      - cinder-operator-s2i-testing
    github-check:
      jobs:
        - openstack-k8s-operators-content-provider:
            vars:
              cifmw_install_yamls_sdk_version: v1.41.1
        - cinder-operator-kuttl:
            dependencies:
              - openstack-k8s-operators-content-provider
        - cinder-operator-antelope-tempest:
            dependencies:
              - openstack-k8s-operators-content-provider
